version: "3.8"

services:
  waha:
    image: devlikeapro/waha
    container_name: simulaja-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Sessão padrão iniciada automaticamente
      - WHATSAPP_DEFAULT_SESSION=default
      
      # Exibe QR Code também no terminal Docker
      - WAHA_PRINT_QR=true
      
      # Habilita Dashboard Swagger UI para testes em http://localhost:3000
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=simulaja
      
      # Chave de segurança opcional da API (deixe vazia ou defina a mesma chave no CRM)
      - WAHA_API_KEY=simulaja_secret_2026
      
      # Otimização de logs e memória (~100 MB RAM)
      - WAHA_ZIP_LOGS=true
    volumes:
      # Persistência de sessão do WhatsApp em disco local (nunca desloga ao reiniciar o container)
      - ./waha-sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/server/version"]
      interval: 30s
      timeout: 10s
      retries: 3
