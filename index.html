        const remove = () => {
          const ids = ['lovable-badge', 'lovable-badge-container', 'lovable-badge-cta', 'lovable-badge-close', 'gpt-designer-badge'];
          ids.forEach(function(id) {

          });
          document.querySelectorAll('.lovable-badge, [data-lovable-badge]').forEach(function(b) {
            if (b.id !== 'root' && b.tagName !== 'BODY' && b.tagName !== 'HTML') b.remove();
          });
        };
        var observer = new MutationObserver(remove);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', remove);
      })();
